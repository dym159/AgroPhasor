# ==============================================================================
# Gitleaks Configuration — AgroPhasor (Nasa_AgroFarm)
# NASA Space Apps Challenge 2026: "Field Shift: Adapting Farms with NASA Data"
# ==============================================================================

[extend]
useDefault = true

[allowlist]
description = "Public NASA API URLs and documented examples"
regexes = [
  '''https://power\.larc\.nasa\.gov/api/.*''',
  '''https://server\.arcgisonline\.com/ArcGIS/rest/services/.*''',
  '''https://urs\.earthdata\.nasa\.gov/.*''',
]

paths = [
  '''\.env\.example$''',
  '''README\.md$''',
  '''docs/.*''',
  '''referencias/.*''',
]
