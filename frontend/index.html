<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroPhasor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css"
    crossorigin=""
  />
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar" aria-label="Parcel controls">
      <div id="parcel-bar" class="parcel-bar"></div>
    </header>

    <main class="workspace-grid">
      <div class="col-left">
        <aside id="strategy-panel" class="panel panel-top-left" aria-label="Decision strategies"></aside>
        <aside id="knobs-panel" class="panel panel-bottom-left" aria-label="Priority knobs"></aside>
      </div>

      <div class="col-center">
        <section id="center-stage" class="center-stage" aria-label="Parcel selection and 3D view"></section>
        <section id="timeline-bar" class="timeline-stage" aria-label="Planting phase calendar"></section>
      </div>

      <div class="col-right">
        <aside id="crops-panel" class="panel panel-top-right" aria-label="Crop catalog"></aside>
        <aside id="rotations-panel" class="panel panel-bottom-right" aria-label="Recommended crop rotation"></aside>
      </div>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
  <script
    src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"
    crossorigin=""
  ></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
